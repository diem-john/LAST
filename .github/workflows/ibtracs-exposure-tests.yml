name: IBTrACS exposure analysis tests

on:
  push:
    paths:
      - "forecasting/data/ibtracs_exposure.py"
      - "forecasting/data/ibtracs_regions.py"
      - "tests/test_ibtracs_exposure_analysis.py"
      - ".github/workflows/ibtracs-exposure-tests.yml"
  pull_request:
    paths:
      - "forecasting/data/ibtracs_exposure.py"
      - "forecasting/data/ibtracs_regions.py"
      - "tests/test_ibtracs_exposure_analysis.py"
      - ".github/workflows/ibtracs-exposure-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib pytest
      - name: Run IBTrACS exposure tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_ibtracs_exposure_analysis.py
