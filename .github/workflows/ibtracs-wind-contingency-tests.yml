name: IBTrACS wind-to-contingency pipeline tests

on:
  push:
    paths:
      - "forecasting/physics/**"
      - "grid/ibtracs_wind_exposure.py"
      - "grid/ibtracs_fragility.py"
      - "grid/weather_faults.py"
      - "grid/restoration_optimization.py"
      - "grid/constraint_preserving_restoration.py"
      - "grid/qaoa_resource_estimates.py"
      - "forecasting/data/ibtracs_*.py"
      - "scripts/calibrate_ibtracs_wind_fragility.py"
      - "scripts/run_ibtracs_sensitivity_analysis.py"
      - "scripts/run_ibtracs_contingency_prioritization.py"
      - "scripts/run_ibtracs_minimal_cut_sets_restoration.py"
      - "scripts/run_phase8_restoration_optimization.py"
      - "scripts/run_phase8_1_xy_mixer_benchmark.py"
      - "scripts/run_phase8_2_depth_resource_benchmark.py"
      - "tests/test_ibtracs_wind_to_contingency.py"
      - "tests/test_ibtracs_contingency_prioritization.py"
      - "tests/test_ibtracs_minimal_cut_sets_restoration.py"
      - "tests/test_restoration_optimization.py"
      - "tests/test_constraint_preserving_restoration.py"
      - "tests/test_qaoa_resource_estimates.py"
      - ".github/workflows/ibtracs-wind-contingency-tests.yml"
  pull_request:
    paths:
      - "forecasting/physics/**"
      - "grid/ibtracs_wind_exposure.py"
      - "grid/ibtracs_fragility.py"
      - "grid/weather_faults.py"
      - "grid/restoration_optimization.py"
      - "grid/constraint_preserving_restoration.py"
      - "grid/qaoa_resource_estimates.py"
      - "forecasting/data/ibtracs_*.py"
      - "scripts/run_ibtracs_contingency_prioritization.py"
      - "scripts/run_ibtracs_minimal_cut_sets_restoration.py"
      - "scripts/run_phase8_restoration_optimization.py"
      - "scripts/run_phase8_1_xy_mixer_benchmark.py"
      - "scripts/run_phase8_2_depth_resource_benchmark.py"
      - "tests/test_ibtracs_wind_to_contingency.py"
      - "tests/test_ibtracs_contingency_prioritization.py"
      - "tests/test_ibtracs_minimal_cut_sets_restoration.py"
      - "tests/test_restoration_optimization.py"
      - "tests/test_constraint_preserving_restoration.py"
      - "tests/test_qaoa_resource_estimates.py"
      - ".github/workflows/ibtracs-wind-contingency-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib pytest
      - name: Run focused physics and restoration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          pytest -q
          tests/test_ibtracs_wind_to_contingency.py
          tests/test_ibtracs_contingency_prioritization.py
          tests/test_ibtracs_minimal_cut_sets_restoration.py
          tests/test_restoration_optimization.py
          tests/test_constraint_preserving_restoration.py
          tests/test_qaoa_resource_estimates.py
